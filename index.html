<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Addiuva - Proveedores de Remolque Paraguay</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style id="leaflet-critical-fix">
    .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane > svg,.leaflet-pane > canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0;}
    .leaflet-container{overflow:hidden;}
    .leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none;}
    .leaflet-tile::selection{background:transparent;}
    .leaflet-safari .leaflet-tile{image-rendering:-webkit-optimize-contrast;}
    .leaflet-marker-icon,.leaflet-marker-shadow{display:block;}
    .leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important;}
    .leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0;}
    .leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y;}
    .leaflet-container.leaflet-touch-drag{touch-action:none;touch-action:pinch-zoom;}
    .leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none;}
    .leaflet-control{position:relative;z-index:800;pointer-events:visiblePainted;pointer-events:auto;}
    .leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none;}
    .leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
    .leaflet-control{float:left;clear:both}.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
    .leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px}.leaflet-popup-content{margin:13px 19px;line-height:1.4}.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg)}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:white;color:#333;box-shadow:0 3px 14px rgba(0,0,0,.4)}
    .leaflet-container a{color:#0078A8}.leaflet-control-zoom a{display:block;text-align:center;text-decoration:none;color:black;background:#fff;border-bottom:1px solid #ccc;width:26px;height:26px;line-height:26px;font:bold 18px Arial}.leaflet-control-zoom a:last-child{border-bottom:0}.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.65);border-radius:4px}.leaflet-bar a:first-child{border-top-left-radius:4px;border-top-right-radius:4px}.leaflet-bar a:last-child{border-bottom-left-radius:4px;border-bottom-right-radius:4px}.leaflet-control-attribution{background:rgba(255,255,255,.8);font-size:11px;padding:0 5px;}
  </style>
  <style>
    :root {
      --addiuva-purple: #271453;
      --addiuva-violet: #5633b8;
      --addiuva-pink: #df4fd5;
      --addiuva-orange: #ffc166;
      --addiuva-red: #e53935;
      --panel-bg: rgba(255,255,255,.96);
    }
    html, body { height: 100%; margin: 0; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
    #map { position: fixed; inset: 0; height: 100vh; width: 100vw; background: #efeafd; }
    .panel { position: absolute; top: 16px; left: 16px; z-index: 1000; background: var(--panel-bg); border-radius: 18px; padding: 16px; box-shadow: 0 12px 30px rgba(39,20,83,.25); width: 340px; border: 1px solid rgba(223,79,213,.22); }
    .brand { display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(39,20,83,.12); padding-bottom:12px; margin-bottom:12px; }
    .brand img { width: 150px; height:auto; display:block; }
    .brand-title { font-weight:800; color:var(--addiuva-purple); font-size:14px; line-height:1.2; }
    .muted { font-size: 12px; color: #5b536e; margin-bottom: 10px; line-height:1.35; }
    .coord-row { display:flex; gap:8px; align-items:center; }
    #coordInput { flex:1; box-sizing: border-box; padding: 11px 12px; border: 1px solid rgba(39,20,83,.18); border-radius: 12px; font-size: 13px; outline: none; }
    #coordInput:focus { border-color: var(--addiuva-pink); box-shadow: 0 0 0 3px rgba(223,79,213,.16); }
    #goBtn { border:0; border-radius:12px; padding: 11px 14px; font-weight:700; color:white; cursor:pointer; background: linear-gradient(135deg, var(--addiuva-pink), var(--addiuva-violet)); box-shadow:0 5px 14px rgba(86,51,184,.25); }
    #goBtn:hover { filter: brightness(.97); }
    .hint { font-size:11px; color:#6a607d; margin-top:8px; }
    .status { font-size:12px; margin-top:10px; color:var(--addiuva-purple); font-weight:600; min-height:16px; }
    .legend { position: absolute; bottom: 22px; left: 16px; z-index: 1000; background: var(--panel-bg); padding: 11px 13px; border-radius: 14px; box-shadow: 0 8px 20px rgba(39,20,83,.2); font-size: 12px; color: var(--addiuva-purple); border:1px solid rgba(223,79,213,.20); }
    .truck-icon { background: linear-gradient(135deg, var(--addiuva-orange), var(--addiuva-pink), var(--addiuva-violet)); border: 2px solid white; border-radius: 50%; box-shadow: 0 3px 10px rgba(39,20,83,.38); width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
    .truck-icon svg { width: 21px; height: 21px; fill: white; }
    .red-pin { background: var(--addiuva-red); border:3px solid white; border-radius:50% 50% 50% 0; width:30px; height:30px; transform:rotate(-45deg); box-shadow:0 4px 12px rgba(0,0,0,.35); position:relative; }
    .red-pin:after { content:''; width:12px; height:12px; background:white; border-radius:50%; position:absolute; left:9px; top:9px; }
    .popup { min-width: 260px; max-width: 340px; }
    .popup h2 { font-size: 16px; margin: 0 0 8px; color: var(--addiuva-purple); }
    .popup .row { margin: 6px 0; font-size: 13px; line-height: 1.35; }
    .popup .label { font-weight: 700; color: var(--addiuva-purple); }
    .popup .zones { max-height: 100px; overflow-y: auto; padding-right: 4px; }
    .leaflet-popup-content-wrapper { border-radius:14px; border-top:4px solid var(--addiuva-pink); }
    .leaflet-control-zoom a { color: var(--addiuva-purple)!important; }
    @media (max-width: 640px) { .panel { width: calc(100% - 56px); } .brand img {width:130px;} .legend { display:none; } }
  </style>
</head>

    const map = L.map('map', { zoomControl: true }).setView([-24.7, -56.0], 7);

    const truckSvg = `<svg viewBox="0 0 24 24"><path d="M3 6h11v9H3V6zm12 3h3.3L21 12.2V15h-2a3 3 0 0 0-6 0H9a3 3 0 0 0-6 0H2V5a1 1 0 0 1 1-1h12v5zm1 1.5V12h3.2L17.9 10.5H16zM6 17.5A1.5 1.5 0 1 0 6 14a1.5 1.5 0 0 0 0 3.5zm10 0A1.5 1.5 0 1 0 16 14a1.5 1.5 0 0 0 0 3.5z"/></svg>`;
    const icon = L.divIcon({
      className: '',
      html: `<div class="truck-icon">${truckSvg}</div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 17],
      popupAnchor: [0, -17]
    });
    const redIcon = L.divIcon({
      className: '',
      html: `<div class="red-pin"></div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 34],
      popupAnchor: [0, -30]
    });

    const group = L.featureGroup().addTo(map);
    let searchMarker = null;

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
    function popupHtml(p) {
      const telClean = String(p.telefono || '').replace(/[^0-9+]/g, '');
      const telLink = telClean ? `<a href="tel:${telClean}">${escapeHtml(p.telefono)}</a>` : escapeHtml(p.telefono);
      return `<div class="popup">
        <h2>${escapeHtml(p.proveedor)}</h2>
        <div class="row"><span class="label">Servicio:</span> ${escapeHtml(p.servicio)}</div>
        <div class="row"><span class="label">Teléfono:</span> ${telLink}</div>
        <div class="row"><span class="label">Base:</span> ${escapeHtml(p.base)}</div>
        <div class="row zones"><span class="label">Zonas que cubre:</span><br>${escapeHtml(p.zonas)}</div>
        <div class="row"><span class="label">Coordinación:</span> ${escapeHtml(p.coordinacion)}</div>
        <div class="row"><span class="label">Coordenadas:</span> ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>
      </div>`;
    }

    proveedores.forEach(p => L.marker([p.lat, p.lng], { icon }).bindPopup(popupHtml(p)).addTo(group));
    if (proveedores.length) map.fitBounds(group.getBounds().pad(0.18));

    function parseCoords(text) {
      const nums = String(text).trim().replace(/;/g, ',').match(/-?\d+(?:\.\d+)?/g);
      if (!nums || nums.length < 2) return null;
      const lat = Number(nums[0]);
      const lng = Number(nums[1]);
      if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
      return [lat, lng];
    }

    function searchCoords() {
      const status = document.getElementById('status');
      const parsed = parseCoords(document.getElementById('coordInput').value);
      if (!parsed) {
        status.textContent = 'Coordenadas inválidas. Usa formato: -25.2637, -57.5759';
        status.style.color = '#e53935';
        return;
      }
      const [lat, lng] = parsed;
      if (searchMarker) map.removeLayer(searchMarker);
      searchMarker = L.marker([lat, lng], { icon: redIcon })
        .addTo(map)
        .bindPopup(`<div class="popup"><h2>Coordenada buscada</h2><div class="row"><span class="label">Latitud:</span> ${lat.toFixed(6)}</div><div class="row"><span class="label">Longitud:</span> ${lng.toFixed(6)}</div></div>`)
        .openPopup();
      map.setView([lat, lng], 15);
      status.textContent = `Marcador rojo creado en ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      status.style.color = '#271453';
    }

    document.getElementById('goBtn').addEventListener('click', searchCoords);
    document.getElementById('coordInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchCoords(); });
    setTimeout(() => { map.invalidateSize(); if (proveedores.length) map.fitBounds(group.getBounds().pad(0.18)); }, 300);
    window.addEventListener('load', () => { map.invalidateSize(); if (proveedores.length) map.fitBounds(group.getBounds().pad(0.18)); });
    window.addEventListener('resize', () => map.invalidateSize());
  </script>
